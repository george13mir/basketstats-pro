<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Jugadores - BasketStats
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>


<div class="sidebar">

  <div class="logo">

    <div class="logo-icono">
      🏀
    </div>

    <div>
      <h2>BasketStats</h2>
      <small>PRO</small>
    </div>

  </div>


  <nav>

    <a href="index.html">
      <span>▣</span>
      Dashboard
    </a>

    <a
      href="jugadores.html"
      class="active"
    >
      <span>👥</span>
      Jugadores
    </a>

    <a href="partidos.html">
      <span>🏀</span>
      Partidos
    </a>

    <a href="entrenamientos.html">
      <span>🏋️</span>
      Entrenamientos
    </a>

    <a href="asistencia.html">
      <span>✅</span>
      Asistencia
    </a>

    <a href="lesiones.html">
      <span>🩹</span>
      Lesiones
    </a>

    <a href="estadisticas.html">
      <span>📊</span>
      Estadísticas
    </a>

  </nav>


  <div class="sidebar-footer">

    <span>Temporada</span>

    <strong>
      2026
    </strong>

  </div>

</div>


<main class="contenido">


  <div class="pagina-header">

    <div>

      <span class="etiqueta">
        PLANTEL
      </span>

      <h1>
        Jugadores
      </h1>

      <p>
        Gestiona los jugadores y
        sus estadísticas deportivas.
      </p>

    </div>


    <button
      class="boton-principal"
      onclick="mostrarFormulario()"
    >
      + Nuevo jugador
    </button>

  </div>


  <section
    id="formularioJugador"
    class="panel formulario oculto"
  >

    <div class="panel-header">

      <div>

        <span class="subtitulo-panel">
          REGISTRO
        </span>

        <h2 id="tituloFormulario">
          Nuevo jugador
        </h2>

      </div>

    </div>


    <input
      type="hidden"
      id="jugadorId"
    >


    <div class="grid-formulario">

      <div class="campo">

        <label>Nombre</label>

        <input
          type="text"
          id="nombre"
          placeholder="Ej. Carlos"
        >

      </div>


      <div class="campo">

        <label>Apellido</label>

        <input
          type="text"
          id="apellido"
          placeholder="Ej. Rojas"
        >

      </div>


      <div class="campo">

        <label>Camiseta</label>

        <input
          type="number"
          id="numero"
          placeholder="Ej. 23"
        >

      </div>


      <div class="campo">

        <label>Posición</label>

        <select id="posicion">

          <option value="">
            Seleccione
          </option>

          <option value="Base">
            Base
          </option>

          <option value="Escolta">
            Escolta
          </option>

          <option value="Alero">
            Alero
          </option>

          <option value="Ala-Pívot">
            Ala-Pívot
          </option>

          <option value="Pívot">
            Pívot
          </option>

        </select>

      </div>


      <div class="campo">

        <label>Edad</label>

        <input
          type="number"
          id="edad"
          placeholder="Ej. 22"
        >

      </div>


      <div class="campo">

        <label>Altura</label>

        <input
          type="number"
          step="0.01"
          id="altura"
          placeholder="Ej. 1.85"
        >

      </div>


      <div class="campo">

        <label>Estado</label>

        <select id="estado">

          <option value="Activo">
            Activo
          </option>

          <option value="Lesionado">
            Lesionado
          </option>

          <option value="Inactivo">
            Inactivo
          </option>

        </select>

      </div>


      <div class="campo">

        <label>
          Partidos jugados
        </label>

        <input
          type="number"
          id="partidos"
          placeholder="0"
        >

      </div>


      <div class="campo">

        <label>Puntos</label>

        <input
          type="number"
          id="puntos"
          placeholder="0"
        >

      </div>


      <div class="campo">

        <label>Rebotes</label>

        <input
          type="number"
          id="rebotes"
          placeholder="0"
        >

      </div>


      <div class="campo">

        <label>Asistencias</label>

        <input
          type="number"
          id="asistencias"
          placeholder="0"
        >

      </div>


      <div class="campo">

        <label>Robos</label>

        <input
          type="number"
          id="robos"
          placeholder="0"
        >

      </div>

    </div>


    <div class="acciones-formulario">

      <button
        class="boton-principal"
        onclick="guardarJugador()"
      >
        Guardar jugador
      </button>

      <button
        class="boton-secundario"
        onclick="ocultarFormulario()"
      >
        Cancelar
      </button>

    </div>

  </section>


  <section class="panel">


    <div class="filtros">

      <div class="buscador-box">

        🔎

        <input
          type="text"
          id="buscador"
          placeholder="Buscar jugador o dorsal..."
          oninput="filtrarJugadores()"
        >

      </div>


      <select
        id="filtroPosicion"
        onchange="filtrarJugadores()"
      >

        <option value="">
          Todas las posiciones
        </option>

        <option value="Base">
          Base
        </option>

        <option value="Escolta">
          Escolta
        </option>

        <option value="Alero">
          Alero
        </option>

        <option value="Ala-Pívot">
          Ala-Pívot
        </option>

        <option value="Pívot">
          Pívot
        </option>

      </select>

    </div>


    <div class="tabla-contenedor">

      <table>

        <thead>

          <tr>

            <th>#</th>
            <th>Jugador</th>
            <th>Posición</th>
            <th>Estado</th>
            <th>PJ</th>
            <th>PTS</th>
            <th>REB</th>
            <th>AST</th>
            <th>ROB</th>
            <th>PTS/PJ</th>
            <th>Acciones</th>

          </tr>

        </thead>

        <tbody id="tablaJugadores">
        </tbody>

      </table>

    </div>


  </section>


</main>


<script src="jugadores.js"></script>

</body>

</html>
